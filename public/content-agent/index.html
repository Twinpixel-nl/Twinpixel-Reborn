<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>TwinPixel contentagent</title>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background:#07101f; color:#f7f9fc; }
      * { box-sizing:border-box; }
      body { margin:0; background:radial-gradient(circle at 80% 0,#123162 0,transparent 35%),#07101f; }
      main { width:min(1100px,calc(100% - 32px)); margin:0 auto; padding:48px 0 80px; }
      header { display:flex; justify-content:space-between; align-items:center; gap:20px; margin-bottom:32px; }
      h1 { margin:0; font-size:clamp(30px,5vw,52px); }
      h2 { margin:0 0 18px; font-size:22px; }
      p { color:#adbad0; line-height:1.6; }
      .card { background:rgba(13,26,48,.92); border:1px solid #263c60; border-radius:18px; padding:24px; margin-bottom:20px; box-shadow:0 20px 70px rgba(0,0,0,.2); }
      .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; }
      .full { grid-column:1/-1; }
      label { display:grid; gap:7px; color:#dce6f6; font-size:14px; font-weight:650; }
      input,select,textarea { width:100%; border:1px solid #334d73; border-radius:10px; background:#081426; color:#fff; padding:12px 14px; font:inherit; }
      textarea { min-height:120px; resize:vertical; line-height:1.5; }
      #bodyMarkdown { min-height:440px; font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-size:14px; }
      button,.button { border:0; border-radius:999px; padding:11px 18px; background:#2f89ff; color:white; font:inherit; font-weight:750; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; justify-content:center; }
      button.secondary,.button.secondary { background:transparent; border:1px solid #41618c; }
      button:disabled { opacity:.55; cursor:wait; }
      .actions { display:flex; flex-wrap:wrap; gap:10px; margin-top:18px; }
      .status { min-height:24px; color:#9fc5ff; }
      .hint { font-size:13px; margin:0; }
      [hidden] { display:none !important; }
      @media (max-width:760px) { .grid { grid-template-columns:1fr; } .full { grid-column:auto; } header { align-items:flex-start; flex-direction:column; } }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="hint">TwinPixel · intern</p>
          <h1>Contentagent</h1>
          <p>Maak één sterk inhoudelijk pakket voor de website, LinkedIn en Instagram.</p>
        </div>
        <div class="actions">
          <a class="button secondary" href="/admin/">Naar Decap</a>
          <button class="secondary" id="loginButton" type="button">Inloggen</button>
        </div>
      </header>

      <section class="card" id="inputCard">
        <h2>Briefing</h2>
        <div class="grid">
          <label class="full">Onderwerp
            <input id="topic" required placeholder="Bijvoorbeeld: waarom een goedkope website later duur wordt" />
          </label>
          <label>Primaire zoekterm
            <input id="primaryKeyword" placeholder="website laten maken Wageningen" />
          </label>
          <label>Categorie
            <select id="category">
              <option value="">Laat de agent kiezen</option>
              <option>Webdesign</option><option>SEO</option><option>UX</option><option>Strategie</option>
            </select>
          </label>
          <label>Doelgroep
            <input id="audience" value="Mkb en organisaties die een professionele website nodig hebben" />
          </label>
          <label>Doel
            <input id="objective" value="Expertise tonen en relevante aanvragen ondersteunen" />
          </label>
          <label class="full">Bronnen en eigen notities
            <textarea id="sourceNotes" placeholder="Plak hier feiten, ervaringen, links en de kern van wat je wilt vertellen."></textarea>
          </label>
          <label class="full">Publieke vierkante afbeelding
            <input id="imageUrl" placeholder="/uploads/social-afbeelding.webp of https://..." />
            <span class="hint">Verplicht voor automatische Instagram-publicatie. Upload de afbeelding eerst via Decap.</span>
          </label>
          <label>Publiceren op social vanaf
            <input id="publishAt" type="datetime-local" />
          </label>
        </div>
        <div class="actions">
          <button id="generateButton" type="button">Genereer concept</button>
        </div>
        <p class="status" id="status"></p>
      </section>

      <section class="card" id="resultCard" hidden>
        <h2>Controleren en aanpassen</h2>
        <div class="grid">
          <label class="full">Titel<input id="title" /></label>
          <label class="full">Meta description<textarea id="description"></textarea></label>
          <label>Slug<input id="slug" /></label>
          <label>Leestijd<input id="readingTime" /></label>
          <label>Categorie<select id="resultCategory"><option>Webdesign</option><option>SEO</option><option>UX</option><option>Strategie</option></select></label>
          <label>Tags, gescheiden door komma's<input id="tags" /></label>
          <label class="full">Blog in Markdown<textarea id="bodyMarkdown"></textarea></label>
          <label class="full">LinkedIn-post<textarea id="linkedInPost"></textarea></label>
          <label class="full">Instagram-caption<textarea id="instagramCaption"></textarea></label>
          <label>Alt-tekst<input id="imageAlt" /></label>
          <label>Visual brief<textarea id="visualBrief"></textarea></label>
        </div>
        <div class="actions">
          <button id="saveButton" type="button">Opslaan als Decap-concept</button>
          <a class="button secondary" href="/admin/#/collections/insights">Open Insights in Decap</a>
        </div>
      </section>
    </main>

    <script>
      const byId = (id) => document.getElementById(id);
      let generatedPackage = null;

      async function token() {
        const user = window.netlifyIdentity.currentUser();
        if (!user) throw new Error("Log eerst in.");
        return user.jwt();
      }

      function setBusy(button, busy) {
        button.disabled = busy;
        button.dataset.label ||= button.textContent;
        button.textContent = busy ? "Even bezig…" : button.dataset.label;
      }

      function setStatus(message, isError = false) {
        byId("status").textContent = message;
        byId("status").style.color = isError ? "#ff9b9b" : "#9fc5ff";
      }

      function readPackage() {
        return {
          title: byId("title").value.trim(),
          description: byId("description").value.trim(),
          slug: byId("slug").value.trim(),
          category: byId("resultCategory").value,
          tags: byId("tags").value.split(",").map((tag) => tag.trim()).filter(Boolean),
          readingTime: byId("readingTime").value.trim(),
          bodyMarkdown: byId("bodyMarkdown").value.trim(),
          linkedInPost: byId("linkedInPost").value.trim(),
          instagramCaption: byId("instagramCaption").value.trim(),
          imageAlt: byId("imageAlt").value.trim(),
          visualBrief: byId("visualBrief").value.trim(),
        };
      }

      function fillPackage(pkg) {
        generatedPackage = pkg;
        for (const key of ["title","description","slug","readingTime","bodyMarkdown","linkedInPost","instagramCaption","imageAlt","visualBrief"]) {
          byId(key).value = pkg[key] || "";
        }
        byId("resultCategory").value = pkg.category;
        byId("tags").value = (pkg.tags || []).join(", ");
        byId("resultCard").hidden = false;
        byId("resultCard").scrollIntoView({ behavior: "smooth", block: "start" });
      }

      byId("loginButton").addEventListener("click", () => {
        if (window.netlifyIdentity.currentUser()) window.netlifyIdentity.logout();
        else window.netlifyIdentity.open();
      });

      byId("generateButton").addEventListener("click", async () => {
        const button = byId("generateButton");
        try {
          setBusy(button, true);
          setStatus("De agent schrijft het contentpakket…");
          const response = await fetch("/api/content-agent/generate", {
            method: "POST",
            headers: { "content-type": "application/json", authorization: `Bearer ${await token()}` },
            body: JSON.stringify({
              topic: byId("topic").value,
              primaryKeyword: byId("primaryKeyword").value,
              category: byId("category").value,
              audience: byId("audience").value,
              objective: byId("objective").value,
              sourceNotes: byId("sourceNotes").value,
            }),
          });
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || "Genereren mislukt.");
          fillPackage(data.package);
          setStatus("Concept klaar. Controleer vooral feiten, voorbeelden en toon.");
        } catch (error) {
          setStatus(error.message, true);
        } finally {
          setBusy(button, false);
        }
      });

      byId("saveButton").addEventListener("click", async () => {
        const button = byId("saveButton");
        try {
          setBusy(button, true);
          setStatus("Concept wordt aan de Decap-content toegevoegd…");
          const publishAtValue = byId("publishAt").value;
          const response = await fetch("/api/content-agent/save", {
            method: "POST",
            headers: { "content-type": "application/json", authorization: `Bearer ${await token()}` },
            body: JSON.stringify({
              package: readPackage(),
              imageUrl: byId("imageUrl").value.trim(),
              publishAt: publishAtValue ? new Date(publishAtValue).toISOString() : null,
            }),
          });
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || "Opslaan mislukt.");
          setStatus(data.message);
          window.setTimeout(() => { window.location.href = data.decapUrl; }, 1800);
        } catch (error) {
          setStatus(error.message, true);
        } finally {
          setBusy(button, false);
        }
      });

      window.netlifyIdentity.on("init", (user) => {
        byId("loginButton").textContent = user ? `Uitloggen (${user.email})` : "Inloggen";
      });
      window.netlifyIdentity.on("login", (user) => {
        byId("loginButton").textContent = `Uitloggen (${user.email})`;
        window.netlifyIdentity.close();
      });
      window.netlifyIdentity.on("logout", () => {
        byId("loginButton").textContent = "Inloggen";
      });
      window.netlifyIdentity.init();
    </script>
  </body>
</html>
