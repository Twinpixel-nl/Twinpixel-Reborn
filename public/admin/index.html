<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>TwinPixel Content Manager</title>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script src="https://unpkg.com/decap-cms@^3/dist/decap-cms.js"></script>
    <style>
      .content-agent-link {
        position: fixed;
        right: 18px;
        bottom: 18px;
        z-index: 9999;
        display: inline-flex;
        align-items: center;
        padding: 10px 16px;
        border-radius: 999px;
        background: #2f89ff;
        color: #fff;
        font: 700 14px/1 system-ui, sans-serif;
        text-decoration: none;
        box-shadow: 0 10px 30px rgba(0, 0, 0, .25);
      }
      .content-agent-link:focus-visible {
        outline: 3px solid #fff;
        outline-offset: 3px;
      }
    </style>

  <body>
    <div id="nc-root"></div>
    <a class="content-agent-link" href="/content-agent/">Nieuwe content met agent</a>
